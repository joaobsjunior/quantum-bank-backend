server:
  port: 8080
  # Never leak internal exception details to API callers.
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never
  max-http-request-header-size: 16KB
  ssl:
    enabled: ${QUANTUM_BANK_BACKEND_SSL_ENABLED:false}
    key-store: ${QUANTUM_BANK_BACKEND_KEY_STORE:../pki/local-ca/runtime/backend-server.p12}
    key-store-password: ${QUANTUM_BANK_BACKEND_KEY_STORE_PASSWORD:changeit}
    key-store-type: PKCS12
    trust-store: ${QUANTUM_BANK_BACKEND_TRUST_STORE:../pki/local-ca/runtime/backend-truststore.p12}
    trust-store-password: ${QUANTUM_BANK_BACKEND_TRUST_STORE_PASSWORD:changeit}
    trust-store-type: PKCS12
    client-auth: NEED
    # Post-quantum only: TLS 1.3 through BCJSSE with the ML-DSA-65 server
    # certificate, mldsa65/mldsa87 signature schemes and the X25519MLKEM768
    # hybrid group (installed by PostQuantumTls before the connector starts).
    protocol: TLS
    enabled-protocols: TLSv1.3
    ciphers: TLS_AES_256_GCM_SHA384,TLS_CHACHA20_POLY1305_SHA256,TLS_AES_128_GCM_SHA256

quantum-bank:
  security:
    issuer-uri: ${QUANTUM_BANK_ISSUER_URI:https://localhost:8180/realms/quantum-bank-local}
    jwk-set-uri: ${QUANTUM_BANK_JWK_SET_URI:https://localhost:8180/realms/quantum-bank-local/protocol/openid-connect/certs}
    audience: quantum-bank-api
    clock-skew: 60s
    otk-ttl: 5m
    otk-max-records: ${QUANTUM_BANK_OTK_MAX_RECORDS:10000}
    otk-retention: 1h
    certificate-profile: quantum-bank-mobile-client-v1
    environment: ${QUANTUM_BANK_ENVIRONMENT:local}
    pki:
      sign-command: ${QUANTUM_BANK_PKI_SIGN_COMMAND:../pki/scripts/sign-csr.sh}
      issuing-cert: ${QUANTUM_BANK_PKI_ISSUING_CERT:../pki/local-ca/trust/issuing-ca.crt}
    mtls:
      # Gateway-only transport guard: when enabled, only client certificates whose
      # CN is listed here may reach the backend (KrakenD's own client identity).
      enforce-gateway-identity: ${QUANTUM_BANK_MTLS_ENFORCE_GATEWAY_IDENTITY:false}
      allowed-client-names: ${QUANTUM_BANK_MTLS_ALLOWED_CLIENT_NAMES:gateway-client}

spring:
  datasource:
    url: ${QUANTUM_BANK_DATASOURCE_URL:jdbc:h2:mem:quantumbank;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: org.h2.Driver
    username: ${QUANTUM_BANK_DATASOURCE_USERNAME:sa}
    password: ${QUANTUM_BANK_DATASOURCE_PASSWORD:}
  h2:
    console:
      enabled: ${QUANTUM_BANK_H2_CONSOLE_ENABLED:false}
  sql:
    init:
      mode: always
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${quantum-bank.security.issuer-uri}
          jwk-set-uri: ${quantum-bank.security.jwk-set-uri}
